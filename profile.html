<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TikTok Clon - Perfil</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <div class="app-container">

    <!-- Perfil -->

    <main class="main-content">
      
      <header class="profile-header">
        <button class="profile-icon-btn" title="Añadir amigos">
          <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>

        <div class="profile-header-name">
          <span>Mi Cuenta</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </div>

        <div class="profile-header-actions">
          <button class="profile-icon-btn" title="Ajustes y privacidad">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
        </div>
      </header>

      <!-- Nombre y descripcion-->

      <div class="profile-page">

        
        <section class="profile-info-section">
          
          <div class="profile-avatar-container">
            <img class="profile-avatar-img" src="assets/images/perfil_5.jpg" alt="Foto de perfil">
            <div class="avatar-add-story-btn" title="Añadir historia">+</div>
          </div>

          <h2 class="profile-handle">
            MzDev
            <svg class="verified-icon" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
          </h2>

          <span class="profile-subhandle">Programador Senior</span>

          <!--Los Siguiendo y likes -->

          <div class="profile-stats-row">
            <div class="stat-item">
              <span class="stat-number">184</span>
              <span class="stat-label">Siguiendo</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
              <span class="stat-number">89.5K</span>
              <span class="stat-label">Seguidores</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
              <span class="stat-number">1.2M</span>
              <span class="stat-label">Me gusta</span>
            </div>
          </div>

          <!-- Botones debajo del perfil -->

          <div class="profile-actions-row">
            <button class="btn-profile-action">Editar perfil</button>
            <button class="btn-profile-action">Compartir</button>
            <button class="btn-profile-action btn-profile-icon" title="Sugerencias">
              <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </button>
          </div>

          <!-- Descripción -->
          
          <p class="profile-bio">
            Mi mamá dice que soy el mejor programador.<br>
            Puro Ctrl + C, Ctrl + V. <br>
          </p>

          <a href="https://github.com/JeshuaD23/ClonApp_RA" class="profile-link" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
            <span>github.com/JeshuaD23/ClonApp_RA</span>
          </a>
        </section>

        <!-- Apartados de los video de la cuenta -->

        <div class="profile-tabs-bar">
          
          <div class="profile-tab active" data-tab="public" title="Videos públicos">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM11 7h2v10h-2zm-4 3h2v7H7zm8 4h2v3h-2z"/></svg>
          </div>
          
          <div class="profile-tab" data-tab="private" title="Videos privados">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </div>
          
          <div class="profile-tab" data-tab="saved" title="Guardados">
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          </div>
          
          <div class="profile-tab" data-tab="liked" title="Videos que te gustaron">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
        </div>

        
        <div class="profile-videos-grid profile-grid-panel" id="grid-public">
          
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_1.jpg" alt="Video fijado">
            <span class="video-pinned-tag">Fijado</span>
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 1.5M
            </div>
          </div>

          
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_2.jpg" alt="Video fijado">
            <span class="video-pinned-tag">Fijado</span>
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 820K
            </div>
          </div>

          
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_3.jpg" alt="Video">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 340K
            </div>
          </div>

          
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_4.jpg" alt="Video">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 125K
            </div>
          </div>

          
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_5.jpg" alt="Video">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 98K
            </div>
          </div>

          
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_6.jpg" alt="Video">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 510K
            </div>
          </div>
        </div>

        
        <div class="profile-videos-grid profile-grid-panel" id="grid-private" style="display: none;">
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_7.jpg" alt="Privado">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg> Privado
            </div>
          </div>
        </div>

        
        <div class="profile-videos-grid profile-grid-panel" id="grid-saved" style="display: none;">
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_8.jpg" alt="Favorito">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg> 2.4M
            </div>
          </div>
        </div>

        
        <div class="profile-videos-grid profile-grid-panel" id="grid-liked" style="display: none;">
          <div class="profile-video-thumb">
            <img src="assets/images/img_usr_9.jpg" alt="Me gusta">
            <div class="profile-thumb-views">
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> 670K
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Navegacion -->

    <nav class="bottom-nav">
      
      <div class="sidebar-logo">
        <svg class="tiktok-icon-logo" viewBox="0 0 24 24">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.298-.002.595.042.88.13V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.66a6.34 6.34 0 0 0 10.82 4.5 6.3 6.3 0 0 0 1.86-4.49V8.84a8.16 8.16 0 0 0 4.91 1.62v-3.77z"/>
        </svg>
        <span class="tiktok-text-logo">TikTok</span>
      </div>

      <a href="index.html" class="nav-link">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <span class="nav-label">Inicio</span>
      </a>

      <a href="search.html" class="nav-link">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <span class="nav-label">Buscar</span>
      </a>

      <div class="nav-create-btn" title="Crear video">
        <div class="btn-bg"></div>
        <div class="btn-inner">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
      </div>

      <a href="messages.html" class="nav-link">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        </div>
        <span class="nav-badge">4</span>
        <span class="nav-label">Bandeja</span>
      </a>

      
      <a href="profile.html" class="nav-link active">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span class="nav-label">Perfil</span>
      </a>
    </nav>

  </div>

  <script src="js/profile.js"></script>
</body>
</html>
